name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: error
          retention-days: 7
