name: maintenance-repair-economic-smoke

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/maintenance-repair-economic-smoke.yml

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
          fetch-depth: 0

      - name: Download exact successful economic and source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ECONOMIC_ARTIFACT_ID: "9451199429"
          ECONOMIC_ARTIFACT_DIGEST: "sha256:f05c88d48c0087be191018e2ad55c2684b59f48ec78cb68cb9118a1695985aee"
          SOURCE_ARTIFACT_ID: "9447571663"
          SOURCE_ARTIFACT_DIGEST: "sha256:a4412af5a8247075e2b2f44d5cfa1067d391de59314a9c180eaa5b720573a0f1"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/recovery
          mkdir -p artifacts/recovery/economic artifacts/recovery/source

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ECONOMIC_ARTIFACT_ID" \
            > artifacts/recovery/economic-artifact-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > artifacts/recovery/source-artifact-metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          checks = (
              (
                  "artifacts/recovery/economic-artifact-metadata.json",
                  int(os.environ["ECONOMIC_ARTIFACT_ID"]),
                  os.environ["ECONOMIC_ARTIFACT_DIGEST"],
                  "recent-economic-smoke-32481332419",
              ),
              (
                  "artifacts/recovery/source-artifact-metadata.json",
                  int(os.environ["SOURCE_ARTIFACT_ID"]),
                  os.environ["SOURCE_ARTIFACT_DIGEST"],
                  "recent-public-chainlink-day-32481332419",
              ),
          )
          for path, expected_id, expected_digest, expected_name in checks:
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              if int(payload.get("id", 0)) != expected_id:
                  raise SystemExit(f"artifact id mismatch for {path}")
              if payload.get("digest") != expected_digest:
                  raise SystemExit(f"artifact digest mismatch for {path}")
              if payload.get("name") != expected_name:
                  raise SystemExit(f"artifact name mismatch for {path}")
              if payload.get("expired") is True:
                  raise SystemExit(f"artifact expired: {path}")
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ECONOMIC_ARTIFACT_ID/zip" \
            > artifacts/recovery/economic.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > artifacts/recovery/source.zip
          unzip -q artifacts/recovery/economic.zip -d artifacts/recovery/economic
          unzip -q artifacts/recovery/source.zip -d artifacts/recovery/source

      - name: Validate recovered semantic evidence and exact source identity
        env:
          EXPECTED_SOURCE_RUN_ID: "32481332419"
          EXPECTED_SOURCE_SHA: "2cb5dcb374880b20e4b6f859991bea92dce6ba95"
          EXPECTED_SOURCE_EVENT_SHA: "a831220e32173a78e879df4024e60f4ffcba6e19"
          EXPECTED_ECONOMIC_SOURCE_SHA: "05d5247b65656f7f1d293f15e733329af9f0a53b"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def load(path: str):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          semantic = load("artifacts/recovery/economic/recent-economic-smoke-semantic-validation.json")
          campaign = load("artifacts/recovery/economic/recent-economic-smoke-campaign.json")
          source_run = load("artifacts/recovery/economic/source-run.json")
          source_report = load(
              "artifacts/recovery/source/recent-public-chainlink-2026-08-18-to-19.json"
          )
          persisted_source = load(
              "evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json"
          )

          expected_run = int(os.environ["EXPECTED_SOURCE_RUN_ID"])
          expected_source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          expected_event_sha = os.environ["EXPECTED_SOURCE_EVENT_SHA"]

          if semantic.get("ready") is not True:
              raise SystemExit("economic semantic validation is not ready")
          checks = semantic.get("checks") or {}
          if not checks or not all(value is True for value in checks.values()):
              raise SystemExit("economic semantic validation contains a failed check")
          if int(semantic.get("research_feature_rows", 0)) != 268:
              raise SystemExit("unexpected research feature row count")
          if int(semantic.get("fold_count", 0)) != 4:
              raise SystemExit("unexpected OOS fold count")
          if int(semantic.get("direction_signal_count", 0)) != 159:
              raise SystemExit("unexpected direction signal count")
          if int(semantic.get("pool_projection_count", 0)) != 230:
              raise SystemExit("unexpected pool projection count")
          if int(semantic.get("joint_epoch_count", 0)) != 159:
              raise SystemExit("unexpected joint epoch count")
          if int(semantic.get("n_scored", 0)) != 159:
              raise SystemExit("unexpected scored outcome count")

          dataset = campaign.get("dataset") or {}
          evaluation = campaign.get("evaluation") or {}
          probability = evaluation.get("probability_metrics") or {}
          assumptions = campaign.get("assumptions") or {}
          manifest = campaign.get("campaign_manifest") or {}
          if int(dataset.get("candidate_rounds", 0)) != 284:
              raise SystemExit("unexpected candidate round count")
          if int(dataset.get("research_feature_rows", 0)) != 268:
              raise SystemExit("unexpected campaign research rows")
          if int(dataset.get("skipped_no_aligned_market_data", -1)) != 14:
              raise SystemExit("unexpected aligned-market skip count")
          if int(evaluation.get("fold_count", 0)) != 4:
              raise SystemExit("campaign fold count mismatch")
          if int(probability.get("n_scored", 0)) != 159:
              raise SystemExit("campaign scored outcome mismatch")
          if assumptions.get("spot_availability_lag_ms") != 250:
              raise SystemExit("Spot availability lag mismatch")
          if assumptions.get("perp_availability_lag_ms") != 250:
              raise SystemExit("Perp availability lag mismatch")
          if assumptions.get("chainlink_availability_lag_ms") != 1000:
              raise SystemExit("Chainlink availability lag mismatch")
          if len(manifest.get("spot_sources") or []) != 1:
              raise SystemExit("Spot provenance missing")
          if len(manifest.get("perp_sources") or []) != 1:
              raise SystemExit("Perp provenance missing")

          for payload, name in ((source_report, "artifact"), (persisted_source, "persisted")):
              if payload.get("success") is not True or payload.get("chainlink_collected") is not True:
                  raise SystemExit(f"one-day Chainlink {name} evidence is not successful")
              if int(payload.get("source_run_id", expected_run)) != expected_run:
                  raise SystemExit(f"one-day Chainlink {name} run id mismatch")
              selected = payload.get("selected") or {}
              report = selected.get("report") or {}
              collection = report.get("collection") or {}
              proof = report.get("oracle_stability_proof") or {}
              if int(collection.get("chainlink_events_inserted", 0)) != 2615:
                  raise SystemExit(f"one-day Chainlink {name} event count mismatch")
              if int(report.get("replay_rounds", 0)) != 284:
                  raise SystemExit(f"one-day Chainlink {name} replay count mismatch")
              if proof.get("method") != (
                  "persisted_route_anchor_then_stateless_change_scan_backward_over_fixed_source_range"
              ):
                  raise SystemExit(f"one-day Chainlink {name} route method mismatch")
              if int(proof.get("new_oracle_events", -1)) != 0:
                  raise SystemExit(f"one-day Chainlink {name} NewOracle proof failed")
              if int(proof.get("aggregator_confirmed_events", -1)) != 0:
                  raise SystemExit(f"one-day Chainlink {name} aggregator proof failed")

          if int(source_run.get("id", 0)) != expected_run:
              raise SystemExit("source workflow run id mismatch")
          if source_run.get("name") != "recent-public-chainlink-day":
              raise SystemExit("source workflow name mismatch")
          if source_run.get("head_sha") != expected_event_sha:
              raise SystemExit("source workflow event SHA mismatch")
          if persisted_source.get("source_sha") != expected_source_sha:
              raise SystemExit("persisted collector checkout SHA mismatch")
          if persisted_source.get("source_event_sha") != expected_event_sha:
              raise SystemExit("persisted source event SHA mismatch")

          report_path = Path(
              "artifacts/recovery/source/recent-public-chainlink-2026-08-18-to-19.json"
          )
          db_path = Path(
              "artifacts/recovery/source/bnbusd-public-chainlink-2026-08-18-to-19.sqlite"
          )
          if hashlib.sha256(report_path.read_bytes()).hexdigest() != (
              "ee99c866905d6819cce3e2537bcc34435a8563adcce6b9d8f9f0ac7c51ecf093"
          ):
              raise SystemExit("one-day Chainlink report SHA256 mismatch")
          if hashlib.sha256(db_path.read_bytes()).hexdigest() != (
              "bc428b4b6caec035dc0859d4e52489885226560d1a97bf23bd2aa6edbc406c2a"
          ):
              raise SystemExit("one-day Chainlink database SHA256 mismatch")
          PY

      - name: Repair canonical economic persistence and recover success evidence
        env:
          ECONOMIC_JOB_ID: "96810154525"
          ECONOMIC_ARTIFACT_ID: "9451199429"
          ECONOMIC_ARTIFACT_DIGEST: "sha256:f05c88d48c0087be191018e2ad55c2684b59f48ec78cb68cb9118a1695985aee"
          SOURCE_ARTIFACT_ID: "9447571663"
          SOURCE_ARTIFACT_DIGEST: "sha256:a4412af5a8247075e2b2f44d5cfa1067d391de59314a9c180eaa5b720573a0f1"
          SOURCE_RUN_ID: "32481332419"
          SOURCE_SHA: "2cb5dcb374880b20e4b6f859991bea92dce6ba95"
          SOURCE_EVENT_SHA: "a831220e32173a78e879df4024e60f4ffcba6e19"
          ECONOMIC_SOURCE_SHA: "05d5247b65656f7f1d293f15e733329af9f0a53b"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          workflow_path = Path(".github/workflows/recent-economic-smoke.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = "      - name: Persist smoke evidence\n"
          end_marker = "      - name: Upload smoke artifacts\n"
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start)
          replacement = '''      - name: Persist smoke evidence
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-economic-smoke-2026-08-18-to-19-latest.json
          if python -c 'import json, pathlib; payload=json.loads(pathlib.Path("evidence/recent-economic-smoke-2026-08-18-to-19-latest.json").read_text()); raise SystemExit(0 if payload.get("success") is True else 1)'; then
            cp evidence/recent-economic-smoke-2026-08-18-to-19-latest.json evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json
            python -c 'import json, pathlib; path=pathlib.Path("evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json"); payload=json.loads(path.read_text()); payload["evidence_role"]="last_success"; path.write_text(json.dumps(payload, indent=2, sort_keys=True)+"\\n")'
            git add evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json
          fi
          if git diff --cached --quiet; then
            echo 'Recent economic smoke evidence unchanged.'
          else
            git commit -m 'chore: record recent economic smoke evidence'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi

'''
          workflow_path.write_text(
              workflow[:start] + replacement + workflow[end:],
              encoding="utf-8",
          )

          def load(path: str):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def error_text(path: str):
              text = Path(path).read_text(encoding="utf-8", errors="replace").strip()
              return text[-4000:] if text else None

          campaign = load("artifacts/recovery/economic/recent-economic-smoke-campaign.json")
          semantic = load(
              "artifacts/recovery/economic/recent-economic-smoke-semantic-validation.json"
          )
          source_run = load("artifacts/recovery/economic/source-run.json")
          spot = load("artifacts/recovery/economic/recent-economic-smoke-spot-ingest.json")
          perp = load("artifacts/recovery/economic/recent-economic-smoke-perp-ingest.json")
          source_report = Path(
              "artifacts/recovery/source/recent-public-chainlink-2026-08-18-to-19.json"
          )
          source_db = Path(
              "artifacts/recovery/source/bnbusd-public-chainlink-2026-08-18-to-19.sqlite"
          )

          payload = {
              "evidence_version": 5,
              "evidence_role": "latest_attempt",
              "purpose": "recent_source_bound_economic_pipeline_smoke",
              "success": True,
              "profitability_gate_eligible": False,
              "full_historical_gate_satisfied": False,
              "signing_enabled": False,
              "live_broadcast": False,
              "workflow_outcome": "success",
              "step_outcomes": {
                  "source": "success",
                  "source_artifact": "success",
                  "schema": "success",
                  "binance_download": "success",
                  "binance_ingest": "success",
                  "campaign": "success",
                  "campaign_semantics": "success",
              },
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "source_event_sha": os.environ["SOURCE_EVENT_SHA"],
              "source_current_run": True,
              "source_run": source_run,
              "trigger_sha": os.environ["SOURCE_EVENT_SHA"],
              "economic_source_sha": os.environ["ECONOMIC_SOURCE_SHA"],
              "source_window": {
                  "market": "BNBUSD",
                  "start_timestamp": 1787011200,
                  "end_timestamp": 1787097600,
              },
              "availability_assumptions_ms": {
                  "spot": 250,
                  "um_futures": 250,
                  "chainlink": 1000,
                  "max_chainlink_age": 300000,
              },
              "economic_assumptions": {
                  "stake_wei": 10000000000000000,
                  "bet_gas_wei": 50000000000000,
                  "claim_gas_wei": 30000000000000,
                  "inclusion_latency_seconds": 2,
              },
              "oos_smoke_config": {
                  "min_train_rounds": 100,
                  "test_rounds": 50,
                  "purge_rounds": 2,
                  "embargo_rounds": 2,
                  "calibration_rounds": 20,
                  "pool_min_train_rounds": 50,
                  "pool_window_rounds": 200,
              },
              "chainlink_artifact_sha256": hashlib.sha256(
                  source_report.read_bytes()
              ).hexdigest(),
              "chainlink_database_sha256": hashlib.sha256(
                  source_db.read_bytes()
              ).hexdigest(),
              "binance_spot_ingest": spot,
              "binance_perp_ingest": perp,
              "campaign": campaign,
              "campaign_semantics": semantic,
              "errors": {
                  "source": error_text("artifacts/recovery/economic/recent-economic-smoke-source.err"),
                  "source_artifact": error_text(
                      "artifacts/recovery/economic/recent-economic-smoke-source-artifact.err"
                  ),
                  "schema": error_text("artifacts/recovery/economic/recent-economic-smoke-schema.err"),
                  "binance_download": error_text(
                      "artifacts/recovery/economic/recent-economic-smoke-binance-download.err"
                  ),
                  "binance_ingest": error_text(
                      "artifacts/recovery/economic/recent-economic-smoke-binance-ingest.err"
                  ),
                  "campaign": error_text("artifacts/recovery/economic/recent-economic-smoke-campaign.err"),
                  "campaign_semantics": error_text(
                      "artifacts/recovery/economic/recent-economic-smoke-semantic-validation.err"
                  ),
              },
              "persistence_recovery": {
                  "recovered": True,
                  "reason": (
                      "The economic computation, non-vacuity semantic gate, artifact upload, "
                      "and final economic gate all succeeded. Only the original nested-heredoc "
                      "repository persistence shell step failed, so durable evidence was recovered "
                      "from the exact successful artifact and exact one-day source artifact."
                  ),
                  "source_workflow_run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "economic_job_id": int(os.environ["ECONOMIC_JOB_ID"]),
                  "economic_artifact_id": int(os.environ["ECONOMIC_ARTIFACT_ID"]),
                  "economic_artifact_digest": os.environ["ECONOMIC_ARTIFACT_DIGEST"],
                  "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
                  "source_artifact_digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
                  "economic_source_sha": os.environ["ECONOMIC_SOURCE_SHA"],
              },
              "interpretation": (
                  "Pipeline smoke only: validates exact-source binding, positive availability lags, "
                  "non-vacuous purged/embargoed OOS plumbing, and explicit costs on a one-day sample. "
                  "It is not profitability evidence and does not satisfy the full historical source gate."
              ),
          }
          latest = Path("evidence/recent-economic-smoke-2026-08-18-to-19-latest.json")
          latest.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          success = dict(payload)
          success["evidence_role"] = "last_success"
          Path("evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json").write_text(
              json.dumps(success, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          grep -q "if python -c" .github/workflows/recent-economic-smoke.yml
          if grep -q "if python - <<'PY'" .github/workflows/recent-economic-smoke.yml; then
            echo 'Nested heredoc persistence form still present.' >&2
            exit 2
          fi

      - name: Verify recovered evidence, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for role, path in (
              ("latest_attempt", "evidence/recent-economic-smoke-2026-08-18-to-19-latest.json"),
              ("last_success", "evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json"),
          ):
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              if payload.get("evidence_role") != role:
                  raise SystemExit(f"unexpected evidence role in {path}")
              if payload.get("success") is not True:
                  raise SystemExit(f"recovered economic evidence is not successful: {path}")
              if payload.get("profitability_gate_eligible") is not False:
                  raise SystemExit("one-day smoke must not become profitability eligible")
              if payload.get("full_historical_gate_satisfied") is not False:
                  raise SystemExit("one-day smoke must not satisfy the historical gate")
              if payload.get("signing_enabled") is not False or payload.get("live_broadcast") is not False:
                  raise SystemExit("economic evidence crossed the research/signer boundary")
              semantic = payload.get("campaign_semantics") or {}
              if semantic.get("ready") is not True:
                  raise SystemExit("recovered semantic evidence is not ready")
              if int(semantic.get("research_feature_rows", 0)) != 268:
                  raise SystemExit("recovered research row count mismatch")
              recovery = payload.get("persistence_recovery") or {}
              if recovery.get("recovered") is not True:
                  raise SystemExit("persistence recovery provenance is missing")
              if int(recovery.get("economic_artifact_id", 0)) != 9451199429:
                  raise SystemExit("wrong economic recovery artifact")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/recent-economic-smoke.yml \
            evidence/recent-economic-smoke-2026-08-18-to-19-latest.json \
            evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json
          git rm .github/workflows/maintenance-repair-economic-smoke.yml
          git commit -m 'fix: recover successful recent economic smoke evidence'
          git fetch origin agent/v0.7-alpha-research
          git rebase origin/agent/v0.7-alpha-research
          git push origin HEAD:agent/v0.7-alpha-research
