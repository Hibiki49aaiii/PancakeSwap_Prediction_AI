name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pcs-prediction status
      - run: pcs-clickhouse --help
      - run: mkdir -p artifacts
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . --output-format=github 2>&1 | tee artifacts/ruff.log
      - name: mypy strict
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          mypy src tests 2>&1 | tee artifacts/mypy.log
      - name: pytest with coverage
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest --cov=src/pancake_prediction --cov-report=term-missing 2>&1 \
            | tee artifacts/pytest.log
      - name: Bandit
        id: bandit
        continue-on-error: true
        run: |
          set -o pipefail
          bandit -c pyproject.toml -r src 2>&1 | tee artifacts/bandit.log
      - name: pip-audit
        id: pip_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pip-audit 2>&1 | tee artifacts/pip-audit.log
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: artifacts/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce quality gate
        if: always()
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
        run: |
          if [ "$RUFF_OUTCOME" != success ] || \
             [ "$MYPY_OUTCOME" != success ] || \
             [ "$PYTEST_OUTCOME" != success ] || \
             [ "$BANDIT_OUTCOME" != success ] || \
             [ "$PIP_AUDIT_OUTCOME" != success ]; then
            echo "quality gate failed: ruff=$RUFF_OUTCOME mypy=$MYPY_OUTCOME pytest=$PYTEST_OUTCOME bandit=$BANDIT_OUTCOME pip-audit=$PIP_AUDIT_OUTCOME" >&2
            exit 2
          fi

  clickhouse-integration:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Apply ClickHouse schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from pancake_prediction.clickhouse import ClickHouseHttpClient

          client = ClickHouseHttpClient("http://127.0.0.1:8123")
          text = Path("sql/clickhouse/v0_7_core.sql").read_text(encoding="utf-8")
          sql = "\n".join(
              line for line in text.splitlines() if not line.lstrip().startswith("--")
          )
          for statement in sql.split(";"):
              if statement.strip():
                  client.execute(statement)
          PY
      - run: pcs-clickhouse ping
      - run: pcs-clickhouse schema-check
      - name: Build synthetic Binance archive
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          root = Path("/tmp/clickhouse-fixture")
          root.mkdir(parents=True, exist_ok=True)
          archive_path = root / "BNBUSDT-aggTrades-2026-08-01.zip"
          payload = (
              b"1,600.0,1.0,10,10,1785542400000000,false,true\n"
              b"2,601.0,2.0,11,12,1785542400001000,true,true\n"
              b"3,602.0,3.0,13,13,1785542400002000,false,true\n"
          )
          with zipfile.ZipFile(archive_path, "w") as archive:
              archive.writestr("BNBUSDT-aggTrades-2026-08-01.csv", payload)
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum = archive_path.with_name(archive_path.name + ".CHECKSUM")
          checksum.write_text(f"{digest}  {archive_path.name}\n", encoding="utf-8")
          PY
      - name: Prove retry-safe ingest, FINAL reads, and source provenance
        run: |
          python - <<'PY'
          import json
          import subprocess

          from pancake_prediction.clickhouse import ClickHouseHttpClient
          from pancake_prediction.clickhouse_manifest import load_binance_source_slices

          base = [
              "pcs-clickhouse",
              "binance-ingest",
              "--market",
              "BNBUSD",
              "--archive",
              "/tmp/clickhouse-fixture/BNBUSDT-aggTrades-2026-08-01.zip",
              "--checksum",
              "/tmp/clickhouse-fixture/BNBUSDT-aggTrades-2026-08-01.zip.CHECKSUM",
              "--venue",
              "spot",
              "--timestamp-unit",
              "auto",
              "--availability-lag-ms",
              "25",
              "--batch-size",
              "2",
          ]
          for _ in range(2):
              subprocess.run(base, check=True)
          output = subprocess.check_output(
              [
                  "pcs-clickhouse",
                  "binance-window",
                  "--market",
                  "BNBUSD",
                  "--venue",
                  "spot",
                  "--timestamp-unit",
                  "auto",
                  "--availability-lag-ms",
                  "25",
                  "--start-ms",
                  "1785542400000",
                  "--end-ms",
                  "1785542401000",
              ],
              text=True,
          )
          payload = json.loads(output)
          assert payload["timestamp_unit"] == "auto", payload
          assert payload["rows"] == 3, payload
          assert payload["first_aggregate_trade_id"] == 1, payload
          assert payload["last_aggregate_trade_id"] == 3, payload

          slices = load_binance_source_slices(
              ClickHouseHttpClient("http://127.0.0.1:8123"),
              market="BNBUSD",
              venue="spot",
              timestamp_unit="auto",
              availability_lag_ms=25,
              start_timestamp_ms=1785542400000,
              end_timestamp_ms=1785542401000,
          )
          assert len(slices) == 1, slices
          assert slices[0].row_count == 3, slices
          assert slices[0].timestamp_unit == "auto", slices
          assert slices[0].first_aggregate_trade_id == 1, slices
          assert slices[0].last_aggregate_trade_id == 3, slices
          PY

  legacy-rounds-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Download pinned 144k-round benchmark
        run: |
          mkdir -p artifacts
          curl -fsSL \
            https://raw.githubusercontent.com/xcnecon/PancakeSwap-Arbitrage-Bot/93c7ec384ad9bedcf7824e8db050049ef891e367/data/rounds.csv.gz \
            -o /tmp/rounds.csv.gz
      - name: Audit all 144000 rows
        run: |
          python scripts/audit_legacy_rounds.py \
            --archive /tmp/rounds.csv.gz \
            --output artifacts/legacy-rounds-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-rounds-audit-${{ github.run_id }}
          path: artifacts/legacy-rounds-audit.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
