name: prediction-subgraph-capability

on:
  workflow_dispatch:
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official Prediction v2 subgraph deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/prediction-subgraph-capability.json
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          endpoints = [
              "https://api.thegraph.com/subgraphs/name/pancakeswap/prediction-v2",
          ]
          query = '''
          query Capability {
            _meta { block { number hash } hasIndexingErrors }
            latest: rounds(first: 3, orderBy: epoch, orderDirection: desc) {
              id epoch startAt startBlock lockAt lockBlock lockPrice lockRoundId closeAt closeBlock closePrice closeRoundId
              totalBets totalAmount bullBets bullAmount bearBets bearAmount position failed
            }
            old: rounds(first: 3, where: { epoch_lt: "100000" }, orderBy: epoch, orderDirection: desc) {
              id epoch startAt startBlock lockAt lockBlock lockPrice closeAt closeBlock closePrice
              totalBets totalAmount bullAmount bearAmount position failed
            }
          }
          '''

          def post(url):
              payload = json.dumps({"query": query}).encode()
              request = Request(
                  url,
                  data=payload,
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "pancake-prediction-ai/0.7 subgraph-capability",
                  },
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      raw = response.read()
                  parsed = json.loads(raw)
                  return {"ok": True, "response": parsed}
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:1000]
                  return {"ok": False, "error": f"HTTP {exc.code}: {body}"}
              except (URLError, TimeoutError, json.JSONDecodeError) as exc:
                  return {"ok": False, "error": f"{type(exc).__name__}: {exc}"}

          report = {"endpoints": [{"url": url, **post(url)} for url in endpoints]}
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: prediction-subgraph-capability
          path: artifacts/prediction-subgraph-capability.json
          if-no-files-found: error
          retention-days: 14
