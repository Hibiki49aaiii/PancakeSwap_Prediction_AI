name: recent-chainlink-route-proof-probe

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/recent-chainlink-route-proof-probe.yml
      - src/pancake_prediction/public_collector.py
      - src/pancake_prediction/recent_bootstrap.py
      - scripts/run_recent_public_bootstrap.py
      - evidence/recent-public-chainlink-smoke-2026-08-19.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-chainlink-route-proof-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .

      - name: Publish probe run identity
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = {
              "evidence_version": 2,
              "state": "running",
              "purpose": "anchored_fixed_window_chainlink_route_change_scan_probe",
              "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_event_sha": os.environ["GITHUB_SHA"],
              "source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "signing_enabled": False,
              "live_broadcast": False,
          }
          Path("evidence/recent-chainlink-route-proof-probe-running.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-chainlink-route-proof-probe-running.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record anchored route probe run'
            git fetch origin agent/v0.7-alpha-research
            git rebase origin/agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi

      - name: Probe exact Aug18-19 Chainlink route from persisted Aug19 anchor
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts evidence
          python - <<'PY' \
            2> >(tee artifacts/recent-chainlink-route-proof-probe.err >&2)
          import json
          import time
          from pathlib import Path

          from pancake_prediction.contracts import MARKETS
          from pancake_prediction.public_collector import PublicHistoricalCollector
          from pancake_prediction.rpc import JsonRpcClient
          from pancake_prediction.store import EventStore
          from scripts.run_recent_public_bootstrap import load_chainlink_route_anchor

          FROM_BLOCK = 116556542
          TO_BLOCK = 116748497
          MARKET = MARKETS["BNBUSD"]
          ANCHOR_PATH = Path("evidence/recent-public-chainlink-smoke-2026-08-19.json")
          ENDPOINTS = (
              "https://rpc-bsc.48.club",
              "https://bsc-rpc.publicnode.com",
              "https://public.1rpc.io/bnb",
          )
          anchor = load_chainlink_route_anchor(ANCHOR_PATH, market="BNBUSD")
          attempts = []
          selected = None

          for index, endpoint in enumerate(ENDPOINTS, start=1):
              db = Path(f"artifacts/anchored-route-proof-{index}.sqlite")
              if db.exists():
                  db.unlink()
              started = time.monotonic()
              try:
                  rpc = JsonRpcClient(
                      endpoint,
                      timeout_s=10.0,
                      retries=3,
                      backoff_s=0.75,
                      min_interval_s=0.15,
                  )
                  store = EventStore(db)
                  store.initialize()
                  collector = PublicHistoricalCollector(
                      rpc=rpc,
                      store=store,
                      chunk_size=50_000,
                  )
                  proof = collector.prove_oracle_stable_from_anchor(
                      MARKET,
                      from_block=FROM_BLOCK,
                      through_block=TO_BLOCK,
                      anchor_block=anchor.anchor_block,
                      oracle_proxy=anchor.oracle_proxy,
                      chainlink_aggregator=anchor.chainlink_aggregator,
                      anchor_evidence_sha256=anchor.evidence_sha256,
                  )
                  result = {
                      "endpoint": endpoint,
                      "outcome": "success",
                      "elapsed_ms": int((time.monotonic() - started) * 1000),
                      "proof": proof,
                      "error": None,
                  }
                  attempts.append(result)
                  selected = result
                  break
              except Exception as exc:
                  attempts.append(
                      {
                          "endpoint": endpoint,
                          "outcome": "failure",
                          "elapsed_ms": int((time.monotonic() - started) * 1000),
                          "proof": None,
                          "error": f"{type(exc).__name__}: {exc}"[:2000],
                      }
                  )

          payload = {
              "evidence_version": 3,
              "evidence_role": "latest_attempt",
              "purpose": "anchored_fixed_window_chainlink_route_change_scan_probe",
              "market": "BNBUSD",
              "from_block": FROM_BLOCK,
              "to_block": TO_BLOCK,
              "requested_start_timestamp": 1787011200,
              "requested_end_timestamp": 1787097600,
              "route_proof_mode": "persisted_evidence_anchor_backward_change_scan",
              "anchor": anchor.as_dict(),
              "rpc_policy": {
                  "timeout_s": 10.0,
                  "retries": 3,
                  "backoff_s": 0.75,
                  "min_interval_s": 0.15,
              },
              "candidate_endpoints": list(ENDPOINTS),
              "success": selected is not None,
              "selected": selected,
              "attempts": attempts,
              "archive_state_required": False,
              "archive_complete_source_claim": False,
              "profitability_gate_eligible": False,
              "signing_enabled": False,
              "live_broadcast": False,
          }
          Path("artifacts/recent-chainlink-route-proof-probe.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          raise SystemExit(0 if selected is not None else 2)
          PY

      - name: Upload route-proof probe artifact
        id: artifact
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recent-chainlink-route-proof-probe-${{ github.run_id }}
          path: |
            artifacts/recent-chainlink-route-proof-probe.json
            artifacts/recent-chainlink-route-proof-probe.err
          if-no-files-found: error
          retention-days: 30

      - name: Persist route-proof probe evidence
        if: always() && !cancelled()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("artifacts/recent-chainlink-route-proof-probe.json")
          if source.is_file() and source.read_text(encoding="utf-8").strip():
              payload = json.loads(source.read_text(encoding="utf-8"))
          else:
              payload = {
                  "evidence_version": 3,
                  "evidence_role": "latest_attempt",
                  "purpose": "anchored_fixed_window_chainlink_route_change_scan_probe",
                  "market": "BNBUSD",
                  "from_block": 116556542,
                  "to_block": 116748497,
                  "requested_start_timestamp": 1787011200,
                  "requested_end_timestamp": 1787097600,
                  "route_proof_mode": "persisted_evidence_anchor_backward_change_scan",
                  "success": False,
                  "selected": None,
                  "attempts": [],
                  "archive_state_required": False,
                  "archive_complete_source_claim": False,
                  "profitability_gate_eligible": False,
                  "signing_enabled": False,
                  "live_broadcast": False,
                  "probe_report_missing": True,
              }

          probe_outcome = os.environ.get("PROBE_OUTCOME", "skipped")
          artifact_outcome = os.environ.get("ARTIFACT_OUTCOME", "skipped")
          gate_success = (
              probe_outcome == "success"
              and artifact_outcome == "success"
              and payload.get("success") is True
          )
          payload["success"] = gate_success
          payload["workflow_outcome"] = "success" if gate_success else "failure"
          payload["step_outcomes"] = {
              "probe": probe_outcome,
              "artifact": artifact_outcome,
          }
          running = Path("evidence/recent-chainlink-route-proof-probe-running.json")
          if running.is_file():
              identity = json.loads(running.read_text(encoding="utf-8"))
              payload["source_run_id"] = identity.get("source_run_id")
              payload["source_event_sha"] = identity.get("source_event_sha")
              payload["source_sha"] = identity.get("source_sha")
          error_path = Path("artifacts/recent-chainlink-route-proof-probe.err")
          payload["probe_error_tail"] = (
              error_path.read_text(encoding="utf-8", errors="replace").strip()[-4000:]
              if error_path.is_file()
              else None
          )
          latest = Path("evidence/recent-chainlink-route-proof-probe-latest.json")
          latest.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-chainlink-route-proof-probe-latest.json
          PROBE_SUCCESS="$(python -c 'import json; print("true" if json.load(open("evidence/recent-chainlink-route-proof-probe-latest.json"))["success"] else "false")')"
          if [ "$PROBE_SUCCESS" = true ]; then
            cp evidence/recent-chainlink-route-proof-probe-latest.json \
              evidence/recent-chainlink-route-proof-probe-last-success.json
            python -c 'import json; p="evidence/recent-chainlink-route-proof-probe-last-success.json"; d=json.load(open(p)); d["evidence_role"]="last_success"; open(p,"w").write(json.dumps(d,indent=2,sort_keys=True)+"\n")'
            git add evidence/recent-chainlink-route-proof-probe-last-success.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record anchored Chainlink route probe'
            git fetch origin agent/v0.7-alpha-research
            git rebase origin/agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi

      - name: Enforce route-proof probe gate
        if: always() && !cancelled()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" != success ] || [ "$ARTIFACT_OUTCOME" != success ]; then
            echo "Anchored Chainlink route probe failed: probe=$PROBE_OUTCOME artifact=$ARTIFACT_OUTCOME" >&2
            exit 2
          fi
          python -c 'import json; d=json.load(open("evidence/recent-chainlink-route-proof-probe-latest.json")); assert d.get("success") is True, "anchored route semantic gate did not clear"'
