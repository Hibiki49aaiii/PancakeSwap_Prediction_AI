name: recent-public-bootstrap-smoke

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/recent-public-bootstrap-smoke.yml
      - scripts/run_recent_public_bootstrap.py
      - src/pancake_prediction/public_collector.py
      - src/pancake_prediction/recent_bootstrap.py
      - src/pancake_prediction/rpc.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-public-bootstrap-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Run two-hour public canonical bootstrap smoke
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p artifacts evidence
          python scripts/run_recent_public_bootstrap.py \
            --market BNBUSD \
            --database artifacts/bnbusd-public-smoke-2026-08-09.sqlite \
            --output artifacts/recent-public-bootstrap-smoke-2026-08-09.json \
            --start-timestamp 1786233600 \
            --end-timestamp 1786240800 \
            --confirmations 64 \
            --chunk-size 2000
      - name: Persist smoke evidence
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          cp artifacts/recent-public-bootstrap-smoke-2026-08-09.json \
            evidence/recent-public-bootstrap-smoke-2026-08-09.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("evidence/recent-public-bootstrap-smoke-2026-08-09.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["workflow_outcome"] = os.environ["SMOKE_OUTCOME"]
          payload["purpose"] = "public_rpc_collector_smoke_only"
          payload["profitability_gate_eligible"] = False
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-public-bootstrap-smoke-2026-08-09.json
          if git diff --cached --quiet; then
            echo 'Public bootstrap smoke evidence unchanged.'
          else
            git commit -m 'chore: record public bootstrap smoke evidence'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-public-bootstrap-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce smoke gate
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$SMOKE_OUTCOME" != success ]; then
            echo 'Public canonical smoke failed; inspect persisted evidence.' >&2
            exit 2
          fi
