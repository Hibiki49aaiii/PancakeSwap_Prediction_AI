name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RPC_URL: https://bsc-dataseed.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Probe small log chunks and epoch-indexed filters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          import os
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          client = ReadOnlyJsonRpcClient(os.environ["RPC_URL"], timeout_seconds=15.0)
          head = int(client.call("eth_blockNumber", []), 16)

          def topic(signature):
              return "0x" + keccak(signature.encode("ascii")).hex()

          def uint_topic(value):
              return "0x" + int(value).to_bytes(32, "big").hex()

          current_raw = client.call(
              "eth_call",
              [{"to": BNB_PREDICTION_CONTRACT, "data": encode_call("currentEpoch()")}, "latest"],
          )
          current_epoch = int(decode_result(current_raw, ("uint256",))[0])

          lifecycle_topics = [
              topic("StartRound(uint256)"),
              topic("LockRound(uint256,uint256,int256)"),
              topic("EndRound(uint256,uint256,int256)"),
          ]
          bet_topics = [
              topic("BetBull(address,uint256,uint256)"),
              topic("BetBear(address,uint256,uint256)"),
          ]
          config_topics = [
              topic("NewBufferAndIntervalSeconds(uint256,uint256)"),
              topic("NewTreasuryFee(uint256,uint256)"),
              topic("NewOracle(address)"),
          ]

          def log_probe(width, topics, extra_topics=None):
              start = max(1, head - width)
              topic_filter = [topics]
              if extra_topics:
                  topic_filter.extend(extra_topics)
              try:
                  logs = client.call(
                      "eth_getLogs",
                      [{
                          "address": BNB_PREDICTION_CONTRACT,
                          "fromBlock": hex(start),
                          "toBlock": hex(head),
                          "topics": topic_filter,
                      }],
                  )
                  return {
                      "width_blocks": width,
                      "ok": True,
                      "count": len(logs),
                      "first_block": int(logs[0]["blockNumber"],16) if logs else None,
                      "last_block": int(logs[-1]["blockNumber"],16) if logs else None,
                  }
              except Exception as exc:
                  return {
                      "width_blocks": width,
                      "ok": False,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  }

          # For BetBull/BetBear, epoch is topic2 (topic1 is sender).
          epoch_topic = uint_topic(current_epoch)
          # For lifecycle events, epoch is topic1.
          result = {
              "chain_id": int(client.call("eth_chainId", []), 16),
              "head_block": head,
              "current_epoch": current_epoch,
              "generic_lifecycle_small_chunks": [
                  log_probe(w, lifecycle_topics) for w in [10, 25, 50, 100, 250, 500]
              ],
              "current_epoch_lifecycle": [
                  log_probe(w, lifecycle_topics, [epoch_topic]) for w in [100, 250, 500, 1_000, 2_000, 5_000]
              ],
              "current_epoch_bets": [
                  log_probe(w, bet_topics, [None, epoch_topic]) for w in [100, 250, 500, 1_000, 2_000, 5_000]
              ],
              "generic_config_small_chunks": [
                  log_probe(w, config_topics) for w in [100, 250, 500, 1_000, 2_000, 5_000]
              ],
          }
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
