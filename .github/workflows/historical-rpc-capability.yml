name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compare third-party historical log depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          PROVIDERS = [
              ("publicnode", "https://bsc-rpc.publicnode.com"),
              ("1rpc", "https://public.1rpc.io/bnb"),
              ("drpc", "https://bsc.drpc.org"),
              ("ankr", "https://rpc.ankr.com/bsc"),
          ]
          OFFSETS = [10_000, 100_000, 1_000_000, 5_000_000]
          WIDTH = 20
          START_TOPIC = "0x" + keccak(b"StartRound(uint256)").hex()

          def probe_provider(name, url):
              result = {"name": name, "rpc_url": url, "window_width_blocks": WIDTH}
              try:
                  client = ReadOnlyJsonRpcClient(url, timeout_seconds=6.0)
                  chain_id = client.chain_id()
                  head = client.block_number()
                  raw = client.call(
                      "eth_call",
                      [{"to": BNB_PREDICTION_CONTRACT, "data": encode_call("currentEpoch()")}, "latest"],
                  )
                  epoch = int(decode_result(raw, ("uint256",))[0])
              except Exception as exc:
                  result.update({"reachable": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  return result
              result.update({"reachable": True, "chain_id": chain_id, "head_block": head, "head_epoch": epoch})
              windows = []
              for offset in OFFSETS:
                  to_block = max(1, head - offset)
                  from_block = max(1, to_block - WIDTH + 1)
                  item = {"offset_blocks": offset, "from_block": from_block, "to_block": to_block}
                  try:
                      values = client.call(
                          "eth_getLogs",
                          [{
                              "address": BNB_PREDICTION_CONTRACT,
                              "fromBlock": hex(from_block),
                              "toBlock": hex(to_block),
                              "topics": [START_TOPIC],
                          }],
                      )
                      item.update({"ok": True, "count": len(values)})
                  except Exception as exc:
                      item.update({"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  windows.append(item)
              result["start_round_windows"] = windows
              return result

          report = {
              "prediction_contract": BNB_PREDICTION_CONTRACT,
              "offsets_blocks": OFFSETS,
              "providers": [probe_provider(*provider) for provider in PROVIDERS],
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
      - name: Probe official Pancake Prediction v2 subgraph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/prediction-subgraph-capability.json
          import json
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          URL = "https://api.thegraph.com/subgraphs/name/pancakeswap/prediction-v2"
          QUERY = '''
          query Capability {
            _meta { block { number hash } hasIndexingErrors }
            latest: rounds(first: 3, orderBy: epoch, orderDirection: desc) {
              id epoch startAt startBlock lockAt lockBlock lockPrice lockRoundId
              closeAt closeBlock closePrice closeRoundId
              totalBets totalAmount bullBets bullAmount bearBets bearAmount position failed
            }
            old: rounds(first: 3, where: { epoch_lt: "100000" }, orderBy: epoch, orderDirection: desc) {
              id epoch startAt startBlock lockAt lockBlock lockPrice
              closeAt closeBlock closePrice totalBets totalAmount bullAmount bearAmount position failed
            }
          }
          '''
          request = Request(
              URL,
              data=json.dumps({"query": QUERY}).encode(),
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "pancake-prediction-ai/0.7 subgraph-capability",
              },
              method="POST",
          )
          try:
              with urlopen(request, timeout=15) as response:
                  raw = response.read()
              result = {"url": URL, "ok": True, "response": json.loads(raw)}
          except HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")[:2000]
              result = {"url": URL, "ok": False, "error": f"HTTP {exc.code}: {body}"}
          except (URLError, TimeoutError, json.JSONDecodeError) as exc:
              result = {"url": URL, "ok": False, "error": f"{type(exc).__name__}: {exc}"}
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: |
            artifacts/historical-rpc-capability.json
            artifacts/prediction-subgraph-capability.json
          if-no-files-found: error
          retention-days: 14
