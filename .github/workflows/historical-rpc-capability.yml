name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Measure PublicNode historical log depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          RPC_URL = "https://bsc-rpc.publicnode.com"
          client = ReadOnlyJsonRpcClient(RPC_URL, timeout_seconds=20.0)

          def topic(signature):
              return "0x" + keccak(signature.encode("ascii")).hex()

          start_topic = topic("StartRound(uint256)")
          oracle_config_topic = topic("NewOracle(address)")
          head = client.block_number()
          raw = client.call(
              "eth_call",
              [{"to": BNB_PREDICTION_CONTRACT, "data": encode_call("currentEpoch()")}, "latest"],
          )
          head_epoch = int(decode_result(raw, ("uint256",))[0])

          def probe_log_window(offset, width, topic0):
              to_block = max(1, head - offset)
              from_block = max(1, to_block - width + 1)
              item = {
                  "offset_blocks": offset,
                  "width_blocks": width,
                  "from_block": from_block,
                  "to_block": to_block,
              }
              try:
                  values = client.call(
                      "eth_getLogs",
                      [{
                          "address": BNB_PREDICTION_CONTRACT,
                          "fromBlock": hex(from_block),
                          "toBlock": hex(to_block),
                          "topics": [topic0],
                      }],
                  )
                  item.update({"ok": True, "count": len(values)})
              except Exception as exc:
                  item.update({"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
              return item

          offsets = [0, 2_500, 5_000, 10_000, 20_000, 50_000, 100_000, 250_000, 500_000, 1_000_000]
          report = {
              "rpc_url": RPC_URL,
              "chain_id": client.chain_id(),
              "head_block": head,
              "head_epoch": head_epoch,
              "window_width_blocks": 500,
              "start_round_windows": [probe_log_window(offset, 500, start_topic) for offset in offsets],
              "oracle_config_windows": [probe_log_window(offset, 500, oracle_config_topic) for offset in offsets],
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
