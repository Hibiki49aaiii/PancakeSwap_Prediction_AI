name: historical-rpc-capability

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Read-only BSC RPC URL
        required: false
        default: https://bsc-dataseed.bnbchain.org
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RPC_URL: ${{ inputs.rpc_url || 'https://bsc-dataseed.bnbchain.org' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Probe historical state and logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          import os
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          client = ReadOnlyJsonRpcClient(os.environ["RPC_URL"], timeout_seconds=15.0)
          head = int(client.call("eth_blockNumber", []), 16)
          current_data = encode_call("currentEpoch()")

          def epoch_at(block):
              raw = client.call(
                  "eth_call",
                  [{"to": BNB_PREDICTION_CONTRACT, "data": current_data}, hex(block)],
              )
              return int(decode_result(raw, ("uint256",))[0])

          head_epoch = epoch_at(head)
          offsets = [128, 512, 2_000, 5_000, 10_000, 20_000, 50_000, 100_000, 200_000]
          state = []
          for offset in offsets:
              block = max(1, head - offset)
              item = {"offset_blocks": offset, "block": block}
              try:
                  epoch = epoch_at(block)
                  item.update({
                      "historical_eth_call_ok": True,
                      "epoch": epoch,
                      "epoch_delta_from_head": head_epoch - epoch,
                  })
              except Exception as exc:
                  item.update({
                      "historical_eth_call_ok": False,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  })
              state.append(item)

          log_tests = []
          for width in [1_000, 5_000, 10_000, 20_000, 50_000]:
              start = max(1, head - width)
              item = {"width_blocks": width, "from_block": start, "to_block": head}
              try:
                  logs = client.call(
                      "eth_getLogs",
                      [{
                          "address": BNB_PREDICTION_CONTRACT,
                          "fromBlock": hex(start),
                          "toBlock": hex(head),
                      }],
                  )
                  item.update({
                      "eth_getLogs_ok": True,
                      "log_count": len(logs) if isinstance(logs, list) else None,
                  })
              except Exception as exc:
                  item.update({
                      "eth_getLogs_ok": False,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  })
              log_tests.append(item)

          result = {
              "chain_id": int(client.call("eth_chainId", []), 16),
              "head_block": head,
              "head_epoch": head_epoch,
              "prediction_contract": BNB_PREDICTION_CONTRACT,
              "historical_state": state,
              "log_ranges": log_tests,
          }
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
