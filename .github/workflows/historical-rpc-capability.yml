name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RPC_URL: https://bsc-dataseed.bnbchain.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Probe filtered logs and current-state Chainlink history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          import os
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          client = ReadOnlyJsonRpcClient(os.environ["RPC_URL"], timeout_seconds=15.0)
          head = int(client.call("eth_blockNumber", []), 16)

          def topic(signature):
              return "0x" + keccak(signature.encode("ascii")).hex()

          lifecycle_topics = [
              topic("StartRound(uint256)"),
              topic("LockRound(uint256,uint256,int256)"),
              topic("EndRound(uint256,uint256,int256)"),
          ]
          bet_topics = [
              topic("BetBull(address,uint256,uint256)"),
              topic("BetBear(address,uint256,uint256)"),
          ]
          config_topics = [
              topic("NewBufferAndIntervalSeconds(uint256,uint256)"),
              topic("NewTreasuryFee(uint256,uint256)"),
              topic("NewOracle(address)"),
          ]

          def log_probe(width, topics):
              start = max(1, head - width)
              try:
                  logs = client.call(
                      "eth_getLogs",
                      [{
                          "address": BNB_PREDICTION_CONTRACT,
                          "fromBlock": hex(start),
                          "toBlock": hex(head),
                          "topics": [topics],
                      }],
                  )
                  return {"width_blocks": width, "ok": True, "count": len(logs)}
              except Exception as exc:
                  return {
                      "width_blocks": width,
                      "ok": False,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  }

          # Current oracle reference is a latest-state call, which public RPC supports.
          oracle_raw = client.call(
              "eth_call",
              [{"to": BNB_PREDICTION_CONTRACT, "data": encode_call("oracle()")}, "latest"],
          )
          oracle = str(decode_result(oracle_raw, ("address",))[0]).lower()
          latest_raw = client.call(
              "eth_call",
              [{"to": oracle, "data": encode_call("latestRoundData()")}, "latest"],
          )
          latest = decode_result(
              latest_raw,
              ("uint80", "int256", "uint256", "uint256", "uint80"),
          )
          latest_round = int(latest[0])
          chainlink_history = []
          for offset in [1, 10, 100, 1_000]:
              round_id = latest_round - offset
              item = {"round_offset": offset, "round_id": round_id}
              try:
                  raw = client.call(
                      "eth_call",
                      [{
                          "to": oracle,
                          "data": encode_call(
                              "getRoundData(uint80)",
                              argument_types=("uint80",),
                              arguments=(round_id,),
                          ),
                      }, "latest"],
                  )
                  values = decode_result(
                      raw,
                      ("uint80", "int256", "uint256", "uint256", "uint80"),
                  )
                  item.update({
                      "ok": True,
                      "answer": int(values[1]),
                      "updated_at_s": int(values[3]),
                      "answered_in_round": int(values[4]),
                  })
              except Exception as exc:
                  item.update({
                      "ok": False,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  })
              chainlink_history.append(item)

          result = {
              "chain_id": int(client.call("eth_chainId", []), 16),
              "head_block": head,
              "prediction_contract": BNB_PREDICTION_CONTRACT,
              "oracle": oracle,
              "latest_chainlink_round": latest_round,
              "lifecycle_logs": [log_probe(w, lifecycle_topics) for w in [5_000, 20_000, 50_000, 100_000]],
              "bet_logs": [log_probe(w, bet_topics) for w in [500, 1_000, 2_000, 5_000]],
              "config_logs": [log_probe(w, config_topics) for w in [20_000, 100_000, 500_000]],
              "chainlink_get_round_data": chainlink_history,
          }
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
