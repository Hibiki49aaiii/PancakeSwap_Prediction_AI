name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Probe BSC public RPCs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          endpoints = [
              "https://bsc-dataseed.bnbchain.org",
              "https://bsc-dataseed-public.bnbchain.org",
              "https://bnb.rpc.subquery.network/public",
              "https://bsc-rpc.publicnode.com",
              "https://public.1rpc.io/bnb",
          ]

          def topic(signature):
              return "0x" + keccak(signature.encode("ascii")).hex()

          lifecycle_topics = [
              topic("StartRound(uint256)"),
              topic("LockRound(uint256,uint256,int256)"),
              topic("EndRound(uint256,uint256,int256)"),
          ]
          config_topics = {
              "buffer_interval": topic("NewBufferAndIntervalSeconds(uint256,uint256)"),
              "treasury_fee": topic("NewTreasuryFee(uint256,uint256)"),
              "oracle": topic("NewOracle(address)"),
          }
          current_data = encode_call("currentEpoch()")

          def log_call(client, head, topics, width=1000):
              return client.call(
                  "eth_getLogs",
                  [{
                      "address": BNB_PREDICTION_CONTRACT,
                      "fromBlock": hex(max(1, head - width)),
                      "toBlock": hex(head),
                      "topics": [topics],
                  }],
              )

          def probe(url):
              result = {"rpc_url": url}
              try:
                  client = ReadOnlyJsonRpcClient(url, timeout_seconds=12.0)
                  result["chain_id"] = client.chain_id()
                  head = client.block_number()
                  result["head_block"] = head
                  raw = client.call(
                      "eth_call",
                      [{"to": BNB_PREDICTION_CONTRACT, "data": current_data}, "latest"],
                  )
                  result["head_epoch"] = int(decode_result(raw, ("uint256",))[0])
              except Exception as exc:
                  result.update({"reachable": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  return result
              result["reachable"] = True

              state = []
              for offset in [128, 20_000]:
                  block = max(1, head - offset)
                  item = {"offset_blocks": offset, "block": block}
                  try:
                      raw = client.call(
                          "eth_call",
                          [{"to": BNB_PREDICTION_CONTRACT, "data": current_data}, hex(block)],
                      )
                      item.update({"ok": True, "epoch": int(decode_result(raw, ("uint256",))[0])})
                  except Exception as exc:
                      item.update({"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  state.append(item)
              result["historical_state"] = state

              try:
                  values = log_call(client, head, lifecycle_topics, 1000)
                  result["lifecycle_logs"] = {"ok": True, "count": len(values)}
              except Exception as exc:
                  result["lifecycle_logs"] = {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]}

              config = {}
              for name, value in config_topics.items():
                  try:
                      values = log_call(client, head, [value], 1000)
                      config[name] = {"ok": True, "count": len(values)}
                  except Exception as exc:
                      config[name] = {"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]}
              result["config_logs"] = config
              return result

          report = {
              "prediction_contract": BNB_PREDICTION_CONTRACT,
              "providers": [probe(url) for url in endpoints],
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
