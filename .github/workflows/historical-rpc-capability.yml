name: historical-rpc-capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - v0.7/evidence-gates

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compare third-party historical log depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY' | tee artifacts/historical-rpc-capability.json
          import json
          from eth_hash.auto import keccak
          from pancake_prediction_ai.abi_codec import decode_result, encode_call
          from pancake_prediction_ai.pancake_contract import BNB_PREDICTION_CONTRACT
          from pancake_prediction_ai.read_only_rpc import ReadOnlyJsonRpcClient

          PROVIDERS = [
              ("publicnode", "https://bsc-rpc.publicnode.com", 20),
              ("1rpc", "https://public.1rpc.io/bnb", 20),
              ("drpc", "https://bsc.drpc.org", 20),
              ("ankr", "https://rpc.ankr.com/bsc", 20),
          ]
          OFFSETS = [0, 5_000, 10_000, 50_000, 100_000, 500_000, 1_000_000, 5_000_000]

          def topic(signature):
              return "0x" + keccak(signature.encode("ascii")).hex()

          start_topic = topic("StartRound(uint256)")
          bet_bull_topic = topic("BetBull(address,uint256,uint256)")

          def probe_provider(name, url, width):
              result = {"name": name, "rpc_url": url, "window_width_blocks": width}
              try:
                  client = ReadOnlyJsonRpcClient(url, timeout_seconds=15.0)
                  chain_id = client.chain_id()
                  head = client.block_number()
                  raw = client.call(
                      "eth_call",
                      [{"to": BNB_PREDICTION_CONTRACT, "data": encode_call("currentEpoch()")}, "latest"],
                  )
                  epoch = int(decode_result(raw, ("uint256",))[0])
              except Exception as exc:
                  result.update({"reachable": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  return result

              result.update({"reachable": True, "chain_id": chain_id, "head_block": head, "head_epoch": epoch})

              def window(offset, topic0):
                  to_block = max(1, head - offset)
                  from_block = max(1, to_block - width + 1)
                  item = {
                      "offset_blocks": offset,
                      "from_block": from_block,
                      "to_block": to_block,
                  }
                  try:
                      values = client.call(
                          "eth_getLogs",
                          [{
                              "address": BNB_PREDICTION_CONTRACT,
                              "fromBlock": hex(from_block),
                              "toBlock": hex(to_block),
                              "topics": [topic0],
                          }],
                      )
                      item.update({"ok": True, "count": len(values)})
                  except Exception as exc:
                      item.update({"ok": False, "error": f"{type(exc).__name__}: {exc}"[:500]})
                  return item

              result["start_round_windows"] = [window(offset, start_topic) for offset in OFFSETS]
              result["bet_bull_windows"] = [window(offset, bet_bull_topic) for offset in OFFSETS]
              return result

          report = {
              "prediction_contract": BNB_PREDICTION_CONTRACT,
              "offsets_blocks": OFFSETS,
              "providers": [probe_provider(*provider) for provider in PROVIDERS],
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: historical-rpc-capability
          path: artifacts/historical-rpc-capability.json
          if-no-files-found: error
          retention-days: 14
