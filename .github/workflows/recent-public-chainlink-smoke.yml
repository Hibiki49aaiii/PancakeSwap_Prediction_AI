name: recent-public-chainlink-smoke

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/recent-public-chainlink-smoke.yml
      - scripts/run_recent_public_bootstrap.py
      - src/pancake_prediction/public_collector.py
      - src/pancake_prediction/recent_bootstrap.py
      - src/pancake_prediction/collector.py
      - src/pancake_prediction/rpc.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-public-chainlink-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Run fail-closed public Prediction plus Chainlink smoke
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p artifacts evidence
          python scripts/run_recent_public_bootstrap.py \
            --market BNBUSD \
            --database artifacts/bnbusd-public-chainlink-smoke-2026-08-19.sqlite \
            --output artifacts/recent-public-chainlink-smoke-2026-08-19.json \
            --start-timestamp 1787140800 \
            --end-timestamp 1787148000 \
            --confirmations 64 \
            --chunk-size 2000 \
            --include-chainlink
      - name: Persist latest and last-success Chainlink smoke evidence
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          cp artifacts/recent-public-chainlink-smoke-2026-08-19.json \
            evidence/recent-public-chainlink-smoke-2026-08-19-latest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("evidence/recent-public-chainlink-smoke-2026-08-19-latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["workflow_outcome"] = os.environ["SMOKE_OUTCOME"]
          payload["evidence_role"] = "latest_attempt"
          payload["purpose"] = "public_recent_prediction_chainlink_source_smoke"
          payload["profitability_gate_eligible"] = False
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-public-chainlink-smoke-2026-08-19-latest.json
          if [ "$SMOKE_OUTCOME" = success ]; then
            cp evidence/recent-public-chainlink-smoke-2026-08-19-latest.json \
              evidence/recent-public-chainlink-smoke-2026-08-19-last-success.json
            python - <<'PY'
            import json
            from pathlib import Path

            path = Path("evidence/recent-public-chainlink-smoke-2026-08-19-last-success.json")
            payload = json.loads(path.read_text(encoding="utf-8"))
            payload["evidence_role"] = "last_success"
            path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            PY
            git add evidence/recent-public-chainlink-smoke-2026-08-19-last-success.json
          fi
          if git diff --cached --quiet; then
            echo 'Public Chainlink smoke evidence unchanged.'
          else
            git commit -m 'chore: record recent public Chainlink smoke evidence'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi
      - name: Upload Chainlink smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-public-chainlink-smoke-${{ github.run_id }}
          path: |
            artifacts/recent-public-chainlink-smoke-2026-08-19.json
            artifacts/bnbusd-public-chainlink-smoke-2026-08-19.sqlite
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce Chainlink smoke gate
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$SMOKE_OUTCOME" != success ]; then
            echo 'Recent public Prediction + Chainlink smoke failed; inspect latest evidence.' >&2
            exit 2
          fi
