name: public-archive-candidate-probe

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/public-archive-candidate-probe.yml
      - scripts/probe_public_research_inputs.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-archive-candidate-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Probe additional public BSC candidates
        id: probe
        continue-on-error: true
        run: |
          mkdir -p artifacts evidence
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.probe_public_research_inputs import _probe_rpc

          candidates = (
              "https://bnb.api.onfinality.io/public",
              "https://bsc.drpc.org",
              "https://bsc-mainnet.public.blastapi.io",
              "https://binance.llamarpc.com",
              "https://endpoints.omniatech.io/v1/bsc/mainnet/public",
              "https://bsc-pokt.nodies.app",
              "https://bsc.blockpi.network/v1/rpc/public",
              "https://bsc.meowrpc.com",
              "https://rpc-bsc.48.club",
          )
          results = [_probe_rpc(endpoint, 12.0) for endpoint in candidates]
          archive_ready = [
              str(result["endpoint"])
              for result in results
              if result.get("archive_ready") is True
          ]
          log_replay_ready = [
              str(result["endpoint"])
              for result in results
              if result.get("log_replay_ready") is True
          ]
          combined_ready = [
              str(result["endpoint"])
              for result in results
              if result.get("archive_ready") is True
              and result.get("log_replay_ready") is True
          ]
          payload = {
              "evidence_version": 2,
              "purpose": "additional unauthenticated public BSC capability probe",
              "archive_ready_endpoints": archive_ready,
              "log_replay_ready_endpoints": log_replay_ready,
              "combined_probe_ready_endpoints": combined_ready,
              "results": results,
              "signing_enabled": False,
              "live_broadcast": False,
              "profitability_gate_eligible": False,
          }
          path = Path("artifacts/public-archive-candidate-probe.json")
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          raise SystemExit(0 if archive_ready else 2)
          PY
      - name: Persist capability evidence
        if: always()
        run: |
          cp artifacts/public-archive-candidate-probe.json \
            evidence/public-archive-candidate-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/public-archive-candidate-probe.json
          if git diff --cached --quiet; then
            echo 'Public archive candidate evidence unchanged.'
          else
            git commit -m 'chore: record public archive candidate probe'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-archive-candidate-probe-${{ github.run_id }}
          path: artifacts/public-archive-candidate-probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce archive-state candidate gate
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" != success ]; then
            echo 'No additional tested public BSC candidate satisfied the archive-state gate.' >&2
            exit 2
          fi
          echo 'Archive-state capability only; full historical-source readiness requires log/collector evidence.'
