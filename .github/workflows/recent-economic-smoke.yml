name: recent-economic-smoke

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional successful recent-public-chainlink-day run ID; defaults to persisted last-success evidence
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: recent-economic-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Resolve successful one-day Chainlink source run
        id: source
        env:
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p artifacts/source evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manual = os.environ.get("MANUAL_SOURCE_RUN_ID", "").strip()
          evidence_path = Path("evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json")
          if manual:
              run_id = int(manual)
          else:
              if not evidence_path.exists():
                  raise SystemExit("one-day Chainlink last-success evidence is not available")
              payload = json.loads(evidence_path.read_text(encoding="utf-8"))
              if payload.get("workflow_outcome") != "success" or payload.get("success") is not True:
                  raise SystemExit("persisted one-day Chainlink evidence is not successful")
              if payload.get("chainlink_collected") is not True:
                  raise SystemExit("persisted one-day Chainlink evidence has no Chainlink collection")
              if payload.get("requested_start_timestamp") != 1787011200:
                  raise SystemExit("unexpected one-day Chainlink start timestamp")
              if payload.get("requested_end_timestamp") != 1787097600:
                  raise SystemExit("unexpected one-day Chainlink end timestamp")
              run_id = int(payload["source_run_id"])
          Path("artifacts/source-run-id.txt").write_text(f"{run_id}\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"source_run_id={run_id}\n")
          PY
          SOURCE_RUN_ID="$(cat artifacts/source-run-id.txt)"
          for attempt in $(seq 1 18); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
              > artifacts/source-run.json
            STATE="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/source-run.json").read_text(encoding="utf-8"))
          print(payload.get("conclusion") or payload.get("status") or "unknown")
          PY
          )"
            case "$STATE" in
              success)
                break
                ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "source Chainlink workflow ended with $STATE" >&2
                exit 2
                ;;
            esac
            sleep 5
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("artifacts/source-run.json").read_text(encoding="utf-8"))
          if payload.get("name") != "recent-public-chainlink-day":
              raise SystemExit(f"unexpected source workflow: {payload.get('name')!r}")
          if payload.get("conclusion") != "success":
              raise SystemExit(f"source workflow did not reach success: {payload.get('conclusion')!r}")
          if payload.get("head_branch") != "agent/v0.7-alpha-research":
              raise SystemExit(f"unexpected source branch: {payload.get('head_branch')!r}")
          source_sha = str(payload.get("head_sha", ""))
          if len(source_sha) != 40:
              raise SystemExit("source workflow head SHA is missing")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"source_sha={source_sha}\n")
          PY
      - name: Download exact one-day Chainlink artifact
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "recent-public-chainlink-day-${SOURCE_RUN_ID}" \
            --dir artifacts/source
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/source/recent-public-chainlink-2026-08-18-to-19.json")
          database_path = Path("artifacts/source/bnbusd-public-chainlink-2026-08-18-to-19.sqlite")
          if not report_path.is_file() or not database_path.is_file():
              raise SystemExit("source artifact is missing its report or SQLite database")
          payload = json.loads(report_path.read_text(encoding="utf-8"))
          if payload.get("success") is not True or payload.get("chainlink_collected") is not True:
              raise SystemExit("downloaded source artifact is not a successful Chainlink collection")
          if payload.get("requested_start_timestamp") != 1787011200:
              raise SystemExit("downloaded source artifact start timestamp mismatch")
          if payload.get("requested_end_timestamp") != 1787097600:
              raise SystemExit("downloaded source artifact end timestamp mismatch")
          selected = payload.get("selected") or {}
          report = selected.get("report") or {}
          collection = report.get("collection") or {}
          if int(collection.get("chainlink_events_inserted", 0)) <= 0:
              raise SystemExit("downloaded source artifact contains no Chainlink AnswerUpdated events")
          if int(report.get("replay_rounds", 0)) < 280:
              raise SystemExit("downloaded source artifact has fewer replay rounds than expected")
          PY
      - name: Apply ClickHouse schema
        run: |
          python - <<'PY'
          from pathlib import Path
          from pancake_prediction.clickhouse import ClickHouseHttpClient

          client = ClickHouseHttpClient("http://127.0.0.1:8123")
          text = Path("sql/clickhouse/v0_7_core.sql").read_text(encoding="utf-8")
          sql = "\n".join(
              line for line in text.splitlines() if not line.lstrip().startswith("--")
          )
          for statement in sql.split(";"):
              if statement.strip():
                  client.execute(statement)
          PY
          pcs-clickhouse schema-check
      - name: Download official Binance Aug 18 Spot and USD-M Perp archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance/spot /tmp/binance/perp
          name=BNBUSDT-aggTrades-2026-08-18.zip
          spot_base="https://data.binance.vision/data/spot/daily/aggTrades/BNBUSDT/$name"
          perp_base="https://data.binance.vision/data/futures/um/daily/aggTrades/BNBUSDT/$name"
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$spot_base" \
            -o "/tmp/binance/spot/$name"
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$spot_base.CHECKSUM" \
            -o "/tmp/binance/spot/$name.CHECKSUM"
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$perp_base" \
            -o "/tmp/binance/perp/$name"
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL "$perp_base.CHECKSUM" \
            -o "/tmp/binance/perp/$name.CHECKSUM"
      - name: Verify and ingest Binance archives with positive availability lag
        run: |
          set -o pipefail
          name=BNBUSDT-aggTrades-2026-08-18.zip
          pcs-clickhouse binance-ingest \
            --market BNBUSD \
            --archive "/tmp/binance/spot/$name" \
            --checksum "/tmp/binance/spot/$name.CHECKSUM" \
            --venue spot \
            --timestamp-unit auto \
            --availability-lag-ms 250 \
            | tee artifacts/recent-economic-smoke-spot-ingest.json
          pcs-clickhouse binance-ingest \
            --market BNBUSD \
            --archive "/tmp/binance/perp/$name" \
            --checksum "/tmp/binance/perp/$name.CHECKSUM" \
            --venue um_futures \
            --timestamp-unit milliseconds \
            --availability-lag-ms 250 \
            | tee artifacts/recent-economic-smoke-perp-ingest.json
      - name: Run source-bound recent economic pipeline smoke
        id: campaign
        continue-on-error: true
        run: |
          set -o pipefail
          pcs-clickhouse campaign-evaluate \
            --market BNBUSD \
            --db artifacts/source/bnbusd-public-chainlink-2026-08-18-to-19.sqlite \
            --spot-timestamp-unit auto \
            --spot-availability-lag-ms 250 \
            --perp-timestamp-unit milliseconds \
            --perp-availability-lag-ms 250 \
            --chainlink-availability-lag-ms 1000 \
            --max-chainlink-age-ms 300000 \
            --feature-lead-seconds 20 \
            --stake-wei 10000000000000000 \
            --bet-gas-wei 50000000000000 \
            --claim-gas-wei 30000000000000 \
            --inclusion-latency-seconds 2 \
            --min-expected-value-wei 0 \
            --min-train-rounds 100 \
            --test-rounds 50 \
            --purge-rounds 2 \
            --embargo-rounds 2 \
            --calibration-rounds 20 \
            --pool-min-train-rounds 50 \
            --pool-window-rounds 200 \
            2> artifacts/recent-economic-smoke-campaign.err \
            | tee artifacts/recent-economic-smoke-campaign.json
      - name: Build bounded smoke evidence
        if: always() && !cancelled() && steps.campaign.outcome != 'skipped'
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def load_json(path: str):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def load_optional_json(path: str):
              source = Path(path)
              if not source.exists() or not source.read_text(encoding="utf-8").strip():
                  return None
              try:
                  return json.loads(source.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  return {"json_error": str(exc)}

          def load_error(path: str):
              source = Path(path)
              if not source.exists():
                  return None
              text = source.read_text(encoding="utf-8", errors="replace").strip()
              return text[-4000:] if text else None

          def sha256(path: str) -> str:
              digest = hashlib.sha256()
              with Path(path).open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          payload = {
              "evidence_version": 1,
              "evidence_role": "latest_attempt",
              "purpose": "recent_source_bound_economic_pipeline_smoke",
              "profitability_gate_eligible": False,
              "full_historical_gate_satisfied": False,
              "signing_enabled": False,
              "live_broadcast": False,
              "workflow_outcome": os.environ["CAMPAIGN_OUTCOME"],
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "economic_source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_window": {
                  "market": "BNBUSD",
                  "start_timestamp": 1787011200,
                  "end_timestamp": 1787097600,
              },
              "availability_assumptions_ms": {
                  "spot": 250,
                  "um_futures": 250,
                  "chainlink": 1000,
                  "max_chainlink_age": 300000,
              },
              "economic_assumptions": {
                  "stake_wei": 10000000000000000,
                  "bet_gas_wei": 50000000000000,
                  "claim_gas_wei": 30000000000000,
                  "inclusion_latency_seconds": 2,
              },
              "oos_smoke_config": {
                  "min_train_rounds": 100,
                  "test_rounds": 50,
                  "purge_rounds": 2,
                  "embargo_rounds": 2,
                  "calibration_rounds": 20,
                  "pool_min_train_rounds": 50,
                  "pool_window_rounds": 200,
              },
              "chainlink_artifact_sha256": sha256(
                  "artifacts/source/recent-public-chainlink-2026-08-18-to-19.json"
              ),
              "chainlink_database_sha256": sha256(
                  "artifacts/source/bnbusd-public-chainlink-2026-08-18-to-19.sqlite"
              ),
              "binance_spot_ingest": load_json(
                  "artifacts/recent-economic-smoke-spot-ingest.json"
              ),
              "binance_perp_ingest": load_json(
                  "artifacts/recent-economic-smoke-perp-ingest.json"
              ),
              "campaign": load_optional_json(
                  "artifacts/recent-economic-smoke-campaign.json"
              ),
              "campaign_error": load_error(
                  "artifacts/recent-economic-smoke-campaign.err"
              ),
              "interpretation": (
                  "Pipeline smoke only: validates exact-source binding, positive availability lags, "
                  "purged/embargoed OOS plumbing, and explicit costs on a one-day sample. It is not "
                  "profitability evidence and does not satisfy the full historical source gate."
              ),
          }
          out = Path("evidence/recent-economic-smoke-2026-08-18-to-19-latest.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Persist smoke evidence
        if: always() && !cancelled() && steps.campaign.outcome != 'skipped'
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-economic-smoke-2026-08-18-to-19-latest.json
          if [ "$CAMPAIGN_OUTCOME" = success ]; then
            cp evidence/recent-economic-smoke-2026-08-18-to-19-latest.json \
              evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json
            python - <<'PY'
            import json
            from pathlib import Path

            path = Path("evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json")
            payload = json.loads(path.read_text(encoding="utf-8"))
            payload["evidence_role"] = "last_success"
            path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            PY
            git add evidence/recent-economic-smoke-2026-08-18-to-19-last-success.json
          fi
          if git diff --cached --quiet; then
            echo 'Recent economic smoke evidence unchanged.'
          else
            git commit -m 'chore: record recent economic smoke evidence'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi
      - name: Upload smoke artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: recent-economic-smoke-${{ github.run_id }}
          path: |
            artifacts/source-run.json
            artifacts/source/recent-public-chainlink-2026-08-18-to-19.json
            artifacts/recent-economic-smoke-spot-ingest.json
            artifacts/recent-economic-smoke-perp-ingest.json
            artifacts/recent-economic-smoke-campaign.json
            artifacts/recent-economic-smoke-campaign.err
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce economic smoke result
        if: always() && !cancelled()
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        run: |
          if [ "$CAMPAIGN_OUTCOME" != success ]; then
            echo 'Recent source-bound economic pipeline smoke failed; inspect persisted latest evidence.' >&2
            exit 2
          fi
