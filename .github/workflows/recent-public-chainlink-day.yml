name: recent-public-chainlink-day

on:
  push:
    branches:
      - agent/v0.7-alpha-research
    paths:
      - .github/workflows/recent-public-chainlink-day.yml
      - .github/workflows/recent-economic-smoke.yml
      - scripts/run_recent_public_bootstrap.py
      - src/pancake_prediction/public_collector.py
      - src/pancake_prediction/recent_bootstrap.py
      - src/pancake_prediction/collector.py
      - src/pancake_prediction/rpc.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: recent-public-chainlink-day-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_run_id: ${{ steps.source_identity.outputs.source_run_id }}
      source_sha: ${{ steps.source_identity.outputs.source_sha }}
      source_event_sha: ${{ steps.source_identity.outputs.source_event_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.7-alpha-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Capture source identity
        id: source_identity
        run: |
          echo "source_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_event_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Run one-day public Prediction plus Chainlink bootstrap
        id: bootstrap
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts evidence
          python scripts/run_recent_public_bootstrap.py \
            --market BNBUSD \
            --database artifacts/bnbusd-public-chainlink-2026-08-18-to-19.sqlite \
            --output artifacts/recent-public-chainlink-2026-08-18-to-19.json \
            --start-timestamp 1787011200 \
            --end-timestamp 1787097600 \
            --confirmations 64 \
            --chunk-size 2000 \
            --include-chainlink \
            2> >(tee artifacts/recent-public-chainlink-2026-08-18-to-19.err >&2)
      - name: Validate one-day source files
        id: source_files
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          test -s artifacts/recent-public-chainlink-2026-08-18-to-19.json
          test -s artifacts/bnbusd-public-chainlink-2026-08-18-to-19.sqlite
      - name: Upload one-day artifacts
        id: artifact
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recent-public-chainlink-day-${{ github.run_id }}
          path: |
            artifacts/recent-public-chainlink-2026-08-18-to-19.json
            artifacts/bnbusd-public-chainlink-2026-08-18-to-19.sqlite
            artifacts/recent-public-chainlink-2026-08-18-to-19.err
          if-no-files-found: error
          retention-days: 30
      - name: Persist latest attempt evidence
        if: always() && !cancelled()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          SOURCE_FILES_OUTCOME: ${{ steps.source_files.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          SOURCE_RUN_ID: ${{ steps.source_identity.outputs.source_run_id || github.run_id }}
          SOURCE_SHA: ${{ steps.source_identity.outputs.source_sha || github.sha }}
          SOURCE_EVENT_SHA: ${{ steps.source_identity.outputs.source_event_sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("artifacts/recent-public-chainlink-2026-08-18-to-19.json")
          error_path = Path("artifacts/recent-public-chainlink-2026-08-18-to-19.err")
          if source.is_file() and source.read_text(encoding="utf-8").strip():
              try:
                  payload = json.loads(source.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  payload = {
                      "evidence_version": 6,
                      "market": "BNBUSD",
                      "requested_start_timestamp": 1787011200,
                      "requested_end_timestamp": 1787097600,
                      "success": False,
                      "chainlink_requested": True,
                      "chainlink_collected": False,
                      "source_report_json_error": str(exc),
                      "signing_enabled": False,
                      "live_broadcast": False,
                  }
          else:
              payload = {
                  "evidence_version": 6,
                  "market": "BNBUSD",
                  "requested_start_timestamp": 1787011200,
                  "requested_end_timestamp": 1787097600,
                  "success": False,
                  "chainlink_requested": True,
                  "chainlink_collected": False,
                  "source_report_missing": True,
                  "signing_enabled": False,
                  "live_broadcast": False,
              }

          bootstrap_outcome = os.environ.get("BOOTSTRAP_OUTCOME", "skipped")
          source_files_outcome = os.environ.get("SOURCE_FILES_OUTCOME", "skipped")
          artifact_outcome = os.environ.get("ARTIFACT_OUTCOME", "skipped")
          gate_success = all(
              outcome == "success"
              for outcome in (
                  bootstrap_outcome,
                  source_files_outcome,
                  artifact_outcome,
              )
          )
          payload["workflow_outcome"] = "success" if gate_success else "failure"
          payload["gate_success"] = gate_success
          payload["step_outcomes"] = {
              "bootstrap": bootstrap_outcome,
              "source_files": source_files_outcome,
              "artifact": artifact_outcome,
          }
          payload["evidence_role"] = "latest_attempt"
          payload["purpose"] = "public_recent_prediction_chainlink_one_day"
          payload["profitability_gate_eligible"] = False
          run_id = os.environ.get("SOURCE_RUN_ID", "").strip()
          payload["source_run_id"] = int(run_id) if run_id.isdigit() else None
          payload["source_sha"] = os.environ.get("SOURCE_SHA", "").strip() or None
          payload["source_event_sha"] = (
              os.environ.get("SOURCE_EVENT_SHA", "").strip() or None
          )
          if error_path.is_file():
              error_text = error_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).strip()
              payload["bootstrap_error_tail"] = error_text[-4000:] if error_text else None
          else:
              payload["bootstrap_error_tail"] = None

          path = Path("evidence/recent-public-chainlink-2026-08-18-to-19-latest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/recent-public-chainlink-2026-08-18-to-19-latest.json
          if [ "$BOOTSTRAP_OUTCOME" = success ] && \
             [ "$SOURCE_FILES_OUTCOME" = success ] && \
             [ "$ARTIFACT_OUTCOME" = success ]; then
            cp evidence/recent-public-chainlink-2026-08-18-to-19-latest.json \
              evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json
            python - <<'PY'
            import json
            from pathlib import Path

            path = Path("evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json")
            payload = json.loads(path.read_text(encoding="utf-8"))
            payload["evidence_role"] = "last_success"
            path.write_text(
                json.dumps(payload, indent=2, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            PY
            git add evidence/recent-public-chainlink-2026-08-18-to-19-last-success.json
          fi
          if git diff --cached --quiet; then
            echo 'One-day Chainlink evidence unchanged.'
          else
            git commit -m 'chore: record one-day public Chainlink evidence'
            git pull --rebase origin agent/v0.7-alpha-research
            git push origin HEAD:agent/v0.7-alpha-research
          fi
      - name: Enforce one-day Chainlink gate
        if: always() && !cancelled()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          SOURCE_FILES_OUTCOME: ${{ steps.source_files.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          if [ "$BOOTSTRAP_OUTCOME" != success ] || \
             [ "$SOURCE_FILES_OUTCOME" != success ] || \
             [ "$ARTIFACT_OUTCOME" != success ]; then
            echo "One-day public Prediction + Chainlink gate failed: bootstrap=$BOOTSTRAP_OUTCOME source_files=$SOURCE_FILES_OUTCOME artifact=$ARTIFACT_OUTCOME" >&2
            exit 2
          fi

  economic-smoke:
    needs: bootstrap
    if: ${{ needs.bootstrap.result == 'success' }}
    uses: ./.github/workflows/recent-economic-smoke.yml
    with:
      source_run_id: ${{ needs.bootstrap.outputs.source_run_id }}
      source_sha: ${{ needs.bootstrap.outputs.source_sha }}
      source_event_sha: ${{ needs.bootstrap.outputs.source_event_sha }}
      source_current_run: true
