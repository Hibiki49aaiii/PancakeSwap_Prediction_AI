[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pancakeswap-prediction-ai"
version = "0.7.0"
description = "Settlement-source-first research, leakage-safe validation, and execution-readiness tooling for PancakeSwap Prediction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "EraWeb3Systems"}]
dependencies = []

[project.scripts]
pcs-prediction = "pancake_prediction.cli:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests"]
