[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pancakeswap-prediction-ai"
version = "0.7.0"
description = "Leakage-safe research and execution-readiness tooling for PancakeSwap Prediction"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "PancakeSwap_Prediction_AI contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pancake_prediction"]
