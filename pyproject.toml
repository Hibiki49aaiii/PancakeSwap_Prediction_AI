[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pancake-prediction-ai"
version = "0.7.0"
description = "Evidence-gated research and execution-readiness tooling for PancakeSwap Prediction"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17,<18",
    "eth-abi>=5.2,<6",
    "eth-hash[pycryptodome]>=0.8,<1",
]

[project.scripts]
ppai-collector = "pancake_prediction_ai.collector_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
